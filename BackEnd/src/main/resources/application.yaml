spring:
  profiles:
    active: dev
  application:
    name: MeatShop
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:7777/meat_shop}
    username: ${DB_USER:appointment_user}
    password: ${DB_PASS:appointment_pass}
    driver-class-name: ${DB_DRIVER_NAME:org.postgresql.Driver}
    hikari:
      maximum-pool-size: ${MAX_POOL_SIZE:10}
      minimum-idle: ${MIN_IDLE_CONNECTIONS:5}
      connection-timeout: ${MAX_CONNECTION_TIMEOUT:30000}
      idle-timeout: ${IDLE_TIMEOUT:600000}
      max-lifetime: ${MAX_LIFETIME:1800000}

  jpa:
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        use_sql_comments: true
    open-in-view: false

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    username: ${DB_USER:appointment_user}
    password: ${DB_PASS:appointment_pass}
    locations: classpath:db/migration
    clean: false

logging:
  level:
    org.springframework.web: ${SPRING_WEB_LOG_LEVEL:INFO}
    org.springframework.security: ${SPRING_SECURITY_LOG_LEVEL:INFO}
    org.hibernate: ${SPRING_HIBERNATE_LOG_LEVEL:ERROR}
    com.Market.MeatShop: ${SPRING_MEAT_SHOP_LOG_LEVEL:INFO}

data:
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:7000}
    timeout: ${REDIS_TIME_OUT:60000}
    lettuce:
      pool:
        max-active: ${MAX_REDIS_ACTIVE:8}
        max-idle: ${MAX_REDIS_IDLE:8}
        min-idle: ${MIN_REDIS_IDLE:2}
        max-wait: ${MAX_REDIS_WAIT:-1ms}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: MeatShop
security:
  jwt:
    secret: ${JWT_SECRET:er3ZIZpjuQ6NMg7ef/Ieed9szbvKwWkeq+cEwG13fYA=}
    access-token-expiry: 900
    refresh-token-expiry: 604800
