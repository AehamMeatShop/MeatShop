services:

  postgres:
    image: postgres:17
    container_name: meat_shop_postgres

    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASS}

    ports:
      - "${DB_PORT}:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    networks:
      - meat_shop_network

    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2
    container_name: meat_shop_redis
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT}:6379"

    networks:
      - meat_shop_network

  backend:
    image:
      aehamalhaeak/meat_shop:${BACKEND_VERSION}
    container_name: meat_shop_backend

    environment:
      SPRING_PROFILES_ACTIVE: dev

      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASS: ${DB_PASS}
      SPRING_WEB_LOG_LEVEL: ${SPRING_WEB_LOG_LEVEL}
      SPRING_SECURITY_LOG_LEVEL: ${SPRING_SECURITY_LOG_LEVEL}
      SPRING_HIBERNATE_LOG_LEVEL: ${SPRING_HIBERNATE_LOG_LEVEL}
      SPRING_MEAT_SHOP_LOG_LEVEL: ${SPRING_MEAT_SHOP_LOG_LEVEL}
      REDIS_HOST: redis
      REDIS_PORT: ${REDIS_PORT}

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - meat_shop_network

  loki:
    image: grafana/loki:3.0.0
    container_name: meat_shop_loki
    volumes:
      - loki_data:/loki
      - ../Monitoring/loki/loki.yml:/etc/loki/config.yml
    ports:
      - "${LOKI_SERVER_HTTP_PORT}:3100"

    networks:
      - meat_shop_network

  alloy:
    image: grafana/alloy:latest
    container_name: meat_shop_alloy
    volumes:
      - ../Monitoring/alloy/alloy.config:/etc/alloy/config.alloy
      - /var/run/docker.sock:/var/run/docker.sock
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    command: [ "run", "--storage.path=/var/lib/alloy/data", "/etc/alloy/config.alloy" ]
    networks:
      - meat_shop_network

  prometheus:
    image: prom/prometheus:latest
    container_name: meat_shop_prometheus

    volumes:
      - ../Monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus

    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--web.enable-remote-write-receiver"
    ports:
      - "9090:9090"

    networks:
      - meat_shop_network

  grafana:
    image: grafana/grafana:10.4.2
    container_name: meat_shop_grafana
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: ${GF_USERS_ALLOW_SIGN_UP}

    ports:
      - "${GF_SERVER_HTTP_PORT}:3000"

    networks:
      - meat_shop_network

volumes:
  postgres_data:
  redis_data:
  grafana_data:
  prometheus_data:
  loki_data:
  alloy_config:
networks:
  meat_shop_network:
    driver: bridge
