global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  # ─── Backend Java Application ─────────────────────────────────────
  - job_name: 'meat-shop'
    static_configs:
      - targets: [ 'backend:8080' ]
    metrics_path: '/actuator/prometheus'
    scrape_interval: 10s
    scrape_timeout: 5s

  # ─── Node Exporter (System Metrics) ──────────────────────────────
  - job_name: 'node'
    static_configs:
      - targets: [ 'localhost:9100' ]
    scrape_interval: 15s

  # ─── Prometheus Self ────────────────────────────────────────────
  - job_name: 'prometheus'
    static_configs:
      - targets: [ 'localhost:9090' ]

  # ─── Docker Stats (اختياري) ────────────────────────────────────
  - job_name: 'docker'
    static_configs:
      - targets: [ 'localhost:9323' ]
